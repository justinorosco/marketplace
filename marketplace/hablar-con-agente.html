<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8"/>

<link href="./styles.css" rel="stylesheet"/>
<script async src="https://www.googletagmanager.com/gtag/js?id=G-6DG5H7VM4T"></script>
<script>
  window.dataLayer = window.dataLayer || [];

<body>
<a class="skip-link" href="#main">Saltar al contenido principal</a>
<header class="site-header">
<div class="header-inner container">
<a class="brand" href="index.html"><span>MarketPlace</span></a>
<nav aria-label="Navegación principal" class="main-nav">
<ul>
<li><a href="index.html">Inicio</a></li>
</ul>
</nav>
</div>
</header>
<main id="main">
<div class="container help-page">
<a class="product-breadcrumb" href="index.html">← Volver al inicio</a>
<h1>Hablar con un agente</h1>
<p>El asistente no pudo resolver tu caso. Dejá tus datos y un agente de MarketPlace te contacta.</p>
<form class="publish-data" id="agent-form">
<div class="form-group">
<label for="agent-name">Nombre</label>
<input id="agent-name" name="name" required type="text"/>
</div>
<div class="form-group">
<label for="agent-email">Correo</label>
<input id="agent-email" name="email" required type="email"/>
</div>
<div class="form-group">
<label for="agent-msg">¿Cuál es el problema?</label>
<textarea id="agent-msg" name="message" required rows="4"></textarea>
</div>
<button class="btn btn-primary" type="submit">Enviar a un agente</button>
<p class="cart-pay-status" id="agent-status" role="status"></p>
</form>
</div>
</main>
<script>
  document.getElementById("agent-form").addEventListener("submit", function (event) {
    event.preventDefault();
    document.getElementById("agent-status").textContent = "Listo. Un agente te escribirá a tu correo.";
    if (window.mixpanel) window.mixpanel.track("Agent Contact Requested");
    event.target.reset();
  });
</script>
<script defer src="./script.js"></script>
</body>
</html>
